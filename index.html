<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>พี่แจ๊ค ♡ น้องแก้ม — ครบรอบ 5 ปี 7 เดือน</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #ffeef5;
    background: #140812;
  }

  /* ---------- Romantic background ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1100px 780px at 18% 22%, rgba(255, 95, 143, 0.25), transparent 60%),
      radial-gradient(950px 680px at 82% 72%, rgba(212, 108, 255, 0.20), transparent 60%),
      radial-gradient(900px 860px at 50% 108%, rgba(255, 170, 120, 0.15), transparent 65%),
      linear-gradient(160deg, #1c0a16 0%, #240e1c 45%, #12060e 100%);
  }
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(255, 190, 215, 0.10) 2px, transparent 3px),
      radial-gradient(rgba(255, 150, 190, 0.08) 3px, transparent 4px);
    background-size: 110px 110px, 170px 170px;
    background-position: 0 0, 55px 80px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }

  /* ---------- Sparkle stars ---------- */
  .star {
    position: fixed;
    border-radius: 50%;
    background: #ffd9ea;
    z-index: 1;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.6); }
    50%      { opacity: 0.95; transform: scale(1.3); }
  }

  /* ---------- Title ---------- */
  .title {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 5;
    padding: clamp(20px, 4.5vw, 44px);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .title h1 {
    font-size: clamp(26px, 4.5vw, 46px);
    font-weight: 700;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, #ffb3cf, #ff7aa8 45%, #e0a6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 120, 170, 0.45));
    animation: glowTitle 3s ease-in-out infinite;
  }
  @keyframes glowTitle {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(255,120,170,.35)); }
    50%      { filter: drop-shadow(0 0 34px rgba(255,120,170,.65)); }
  }
  .title .sub {
    margin-top: 10px;
    font-size: clamp(14px, 2.2vw, 20px);
    letter-spacing: 0.18em;
    color: rgba(255, 214, 232, 0.9);
  }
  .title .badge {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: clamp(13px, 1.8vw, 16px);
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #ffd6e6;
    background: rgba(80, 20, 45, 0.45);
    border: 1px solid rgba(255, 170, 200, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(255, 100, 160, 0.25);
  }

  /* ---------- 3D Heart stage ---------- */
  #stage {
    position: fixed; inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    perspective: 1200px;
  }
  #heart3d {
    width: clamp(180px, 34vmin, 300px);
    height: clamp(180px, 34vmin, 300px);
    transform-style: preserve-3d;
    animation: spin3d 14s linear infinite, beat 1.6s ease-in-out infinite;
    position: relative;
    cursor: pointer;
  }
  @keyframes spin3d {
    from { transform: rotateY(0deg) rotateX(8deg); }
    to   { transform: rotateY(360deg) rotateX(8deg); }
  }
  @keyframes beat {
    0%, 100% { scale: 1; }
    12%      { scale: 1.09; }
    24%      { scale: 1; }
    36%      { scale: 1.06; }
    48%      { scale: 1; }
  }
  .layer {
    position: absolute; inset: 0;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C20 64 6 46 6 30 C6 16 17 8 28 8 C38 8 46 14 50 22 C54 14 62 8 72 8 C83 8 94 16 94 30 C94 46 80 64 50 88 Z'/></svg>") center / contain no-repeat;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 88 C20 64 6 46 6 30 C6 16 17 8 28 8 C38 8 46 14 50 22 C54 14 62 8 72 8 C83 8 94 16 94 30 C94 46 80 64 50 88 Z'/></svg>") center / contain no-repeat;
    background: linear-gradient(135deg, #ff6f9f 0%, #ff4f86 40%, #d94fa0 100%);
  }
  .layer.shine {
    background:
      radial-gradient(60px 40px at 32% 28%, rgba(255,255,255,0.55), transparent 70%),
      linear-gradient(135deg, #ff8fb8 0%, #ff5f95 45%, #e055b0 100%);
  }
  #heartGlow {
    position: absolute; inset: -40%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 95, 143, 0.35) 0%, transparent 65%);
    animation: glowPulse 1.6s ease-in-out infinite;
    pointer-events: none;
    transform: translateZ(-60px);
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; scale: 1; }
    30%      { opacity: 1;   scale: 1.12; }
  }

  /* ---------- Orbiting mini hearts ---------- */
  #orbit {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: orbitSpin 9s linear infinite;
    pointer-events: none;
  }
  @keyframes orbitSpin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
  .orb {
    position: absolute;
    top: 50%; left: 50%;
    font-size: clamp(16px, 3vmin, 26px);
    filter: drop-shadow(0 0 8px rgba(255, 140, 180, 0.9));
    animation: orbBob 2.6s ease-in-out infinite;
  }
  @keyframes orbBob {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -12px; }
  }

  /* ---------- Floating hearts rising ---------- */
  .floatHeart {
    position: fixed;
    bottom: -8vh;
    z-index: 3;
    opacity: 0;
    animation: rise var(--dur) linear infinite;
    animation-delay: var(--delay);
    filter: drop-shadow(0 0 10px rgba(255, 120, 170, 0.6));
    pointer-events: none;
    will-change: transform, opacity;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--op); }
    50%  { transform: translateY(-55vh) translateX(var(--sway)) rotate(14deg); }
    90%  { opacity: var(--op); }
    100% { transform: translateY(-115vh) translateX(calc(var(--sway) * -1)) rotate(-10deg); opacity: 0; }
  }

  /* ---------- Love message card ---------- */
  #loveCard {
    position: fixed;
    z-index: 6;
    bottom: clamp(28px, 7vh, 90px);
    left: 50%;
    width: min(92vw, 620px);
    transform: translateX(-50%) translateY(16px) scale(0.92);
    padding: 18px 22px;
    border-radius: 24px;
    background: rgba(52, 14, 32, 0.72);
    border: 1px solid rgba(255, 170, 200, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(255, 80, 140, 0.25), 0 0 60px rgba(255, 100, 160, 0.15);
    font-size: clamp(16px, 4.6vw, 26px);
    font-weight: 600;
    line-height: 1.45;
    color: #ffdfe9;
    text-align: center;
    opacity: 0;
    transition: opacity .6s ease, transform .6s ease;
    pointer-events: none;
    user-select: none;
    white-space: normal;
  }
  #loveCard.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  #loveCard.fade-out {
    opacity: 0;
  }

  /* ---------- Start overlay (enables audio on tap) ---------- */
  #startOverlay {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(16, 5, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    transition: opacity .7s ease;
  }
  #startOverlay.hide { opacity: 0; pointer-events: none; }
  #startOverlay .inner {
    text-align: center;
    animation: invite 1.8s ease-in-out infinite;
  }
  #startOverlay .big { font-size: clamp(40px, 9vmin, 72px); }
  #startOverlay .txt {
    margin-top: 14px;
    font-size: clamp(15px, 2.4vw, 20px);
    letter-spacing: 0.22em;
    color: #ffd6e6;
    text-shadow: 0 0 20px rgba(255, 120, 170, 0.8);
  }
  @keyframes invite {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.06); opacity: 1; }
  }

  /* ---------- Burst hearts on tap ---------- */
  .burst {
    position: fixed;
    z-index: 8;
    pointer-events: none;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<div id="bg"></div>

<!-- twinkling stars -->
<div id="stars"></div>

<!-- title -->
<div class="title">
  <h1>พี่แจ๊ค ♡ น้องแก้ม</h1>
  <div class="sub">ถึงคนที่เค้ารักที่สุดในสามโลก</div>
  <div class="badge">💍 ครบรอบ 5 ปี 7 เดือน 💗</div>
</div>

<!-- 3D heart -->
<div id="stage">
  <div id="heart3d">
    <div id="heartGlow"></div>
    <div id="layers"></div>
    <div id="orbit"></div>
  </div>
</div>

<div id="loveCard"></div>

<!-- tap to start -->
<div id="startOverlay">
  <div class="inner">
    <div class="big">💗</div>
    <div class="txt">แตะเพื่อเปิดความรัก</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Build 3D heart layers ---------- */
  const LAYERS = 16, DEPTH = 4; // total depth = LAYERS*DEPTH
  const layersEl = document.getElementById('layers');
  layersEl.style.transformStyle = 'preserve-3d';
  layersEl.style.position = 'absolute';
  layersEl.style.inset = '0';
  for (let i = 0; i < LAYERS; i++) {
    const d = document.createElement('div');
    d.className = 'layer' + (i === LAYERS - 1 ? ' shine' : '');
    d.style.transform = 'translateZ(' + ((i - (LAYERS - 1) / 2) * DEPTH) + 'px)';
    layersEl.appendChild(d);
  }

  /* ---------- Orbiting mini hearts ---------- */
  const orbitEl = document.getElementById('orbit');
  const orbitHearts = ['💗', '💖', '💎', '💝', '⭐', '💞'];
  orbitHearts.forEach((h, i) => {
    const o = document.createElement('div');
    o.className = 'orb';
    o.textContent = h;
    const ang = (i / orbitHearts.length) * 360;
    const radius = 46; // % of heart size
    o.style.transform =
      'rotateY(' + ang + 'deg) translateX(' + radius + 'vmin) rotateY(' + (-ang) + 'deg)';
    o.style.animationDelay = (i * 0.4) + 's';
    orbitEl.appendChild(o);
  });

  /* ---------- Twinkling stars ---------- */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 2.6;
    s.style.width = s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.setProperty('--dur', (1.6 + Math.random() * 3) + 's');
    s.style.setProperty('--delay', (Math.random() * 4) + 's');
    starsEl.appendChild(s);
  }

  /* ---------- Rising floating hearts ---------- */
  for (let i = 0; i < 22; i++) {
    const f = document.createElement('div');
    f.className = 'floatHeart';
    f.textContent = ['💗', '💖', '💞', '💕'][i % 4];
    f.style.left = (Math.random() * 100) + 'vw';
    f.style.fontSize = (12 + Math.random() * 22) + 'px';
    f.style.setProperty('--dur', (9 + Math.random() * 10) + 's');
    f.style.setProperty('--delay', (Math.random() * 12) + 's');
    f.style.setProperty('--op', (0.25 + Math.random() * 0.5).toFixed(2));
    f.style.setProperty('--sway', ((Math.random() - 0.5) * 120) + 'px');
    document.body.appendChild(f);
  }

  /* ---------- Love messages loop ---------- */
  const loveCard = document.getElementById('loveCard');
  const messages = [
    'รักแก้มที่สุดในโลกเลยนะ ถึงจะดื้อไปหน่อย แต่ก็ไม่เคยคิดจะหยุดรักเลย... รอบนี้พี่ตั้งใจมองข้ามให้อีกที แต่น้องแก้มต้องน่ารักขึ้นแล้วนะ! 💗',
    'ปากบอกว่าน่ารำคาญ แต่ใจคือแพ้ทางแก้มตลอดเลยดิมั้ง... โดนพี่ดุไปนิดอย่าเพิ่งงอนล่ะ ปรับตัวหน่อยนะ ยัยตัวดี 💖',
    'ที่ยอมแพ้ตลอดไม่ใช่เพราะอะไรหรอกนะ เพราะรักล้วนๆ เลย! เลิกดื้อสัก 10% แล้วมาเป็นเด็กดีให้พี่ชื่นใจหน่อยสิ 💘',
    'ดื้อเก่งที่หนึ่ง แต่เรื่องทำให้พี่ตกหลุมรักซ้ำๆ ก็ที่หนึ่งเหมือนกันนะ... เอาเป็นว่าเจ๊ากัน แต่รอบนี้ต้องปรับตัวด้วยนะ รู้ยัง? 💝',
    'ถึงจะน่าตีขนาดไหน แต่พอเห็นหน้าแก้ม พี่ก็ใจอ่อนทุกที... สัญญาได้ไหมว่ารอบนี้จะทำตัวน่ารัก ไม่ดื้อให้พี่ปวดหัวอีก! 💞',
    'รักนะยัยแก้มอ้วน! ดื้อได้ แต่อย่าดื้อบ่อย พี่เหนื่อยง้อ แต่ถ้าปรับตัวให้หน่อย เดี๋ยวพาไปกินของอร่อยๆ เป็นรางวัลเลย! 💍🍰'
  ];
  let msgIdx = Math.floor(Math.random() * messages.length);
  let hideTimer = null;

  function showLove() {
    const msg = messages[msgIdx % messages.length];
    msgIdx = (msgIdx + 1) % messages.length;

    // fade the old message out first, then swap text and fade in
    loveCard.classList.remove('show');
    loveCard.classList.add('fade-out');
    setTimeout(() => {
      loveCard.textContent = msg;
      loveCard.classList.remove('fade-out');
      loveCard.classList.add('show');
    }, 650);

    // reading time ~ Thai reading pace: 0.55s per 10 chars, min 7s, max 14s
    clearTimeout(hideTimer);
    const readTime = Math.min(14000, Math.max(7000, msg.length * 55));
    hideTimer = setTimeout(() => loveCard.classList.remove('show'), readTime);
  }
  (function loop() {
    showLove();
    // schedule next message after this one finishes reading + fade
    const next = Math.min(14000, Math.max(7000, messages[msgIdx % messages.length].length * 55)) + 1400;
    setTimeout(loop, next);
  })();

  /* ---------- Heart burst on tap ---------- */
  function burst(x, y, n) {
    for (let i = 0; i < (n || 14); i++) {
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = ['💗', '💖', '💕', '✨'][i % 4];
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      b.style.fontSize = (14 + Math.random() * 18) + 'px';
      document.body.appendChild(b);

      const dx = (Math.random() - 0.5) * 320;
      const dy = -(80 + Math.random() * 220);
      const rot = (Math.random() - 0.5) * 240;
      const dur = 900 + Math.random() * 700;

      b.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg) scale(0.6)', opacity: 1 },
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(1.1)', opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.15,.65,.4,1)' })
       .onfinish = () => b.remove();
    }
  }

  document.addEventListener('pointerdown', (e) => {
    burst(e.clientX, e.clientY);
    startAudio();
  });

  /* ---------- Procedural romantic music (Web Audio, no files) ---------- */
  let audioCtx = null, musicGain = null, musicTimer = null, musicPlaying = false;

  const scale_ = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C major

  function playNote(freq, time, dur, type, gain) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(gain, time + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    o.connect(g).connect(musicGain);
    o.start(time);
    o.stop(time + dur + 0.05);
  }

  function scheduleMusic() {
    if (!musicPlaying) return;
    const now = audioCtx.currentTime;
    const bpm = 86, beat = 60 / bpm;
    const pattern = [
      [0, 2, 4, 2],
      [1, 3, 5, 3],
      [2, 4, 6, 4],
      [4, 3, 1, 3]
    ];
    let t = now + 0.1;
    for (const bar of pattern) {
      for (let i = 0; i < 4; i++) {
        playNote(scale_[bar[i]], t, beat * 0.6, 'sine', 0.07);
        t += beat * 0.5;
      }
      playNote(scale_[0], t, beat * 1.5, 'triangle', 0.04);
      playNote(scale_[2], t, beat * 1.5, 'triangle', 0.035);
      playNote(scale_[4], t, beat * 1.5, 'triangle', 0.03);
      t += beat * 1.5;
    }
    musicTimer = setTimeout(scheduleMusic, (t - now) * 1000 + 50);
  }

  function startAudio() {
    if (musicPlaying) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.35;
      musicGain.connect(audioCtx.destination);
      musicPlaying = true;
      scheduleMusic();
    } catch (e) { /* audio not available — visual still works */ }
  }

  /* ---------- Start overlay ---------- */
  const overlay = document.getElementById('startOverlay');
  overlay.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    overlay.classList.add('hide');
    startAudio();
    burst(window.innerWidth / 2, window.innerHeight / 2, 24);
  }, { once: false });
})();
</script>

</body>
</html>
