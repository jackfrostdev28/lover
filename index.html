<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>พี่แจ๊ค ♡ น้องแก้ม — ครบรอบ 5 ปี 7 เดือน</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #ffeef5;
    background: #140812;
  }

  /* ---------- Romantic background ---------- */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1100px 780px at 18% 22%, rgba(255, 95, 143, 0.25), transparent 60%),
      radial-gradient(950px 680px at 82% 72%, rgba(212, 108, 255, 0.20), transparent 60%),
      radial-gradient(900px 860px at 50% 108%, rgba(255, 170, 120, 0.15), transparent 65%),
      linear-gradient(160deg, #1c0a16 0%, #240e1c 45%, #12060e 100%);
  }
  #bg::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(255, 190, 215, 0.10) 2px, transparent 3px),
      radial-gradient(rgba(255, 150, 190, 0.08) 3px, transparent 4px);
    background-size: 110px 110px, 170px 170px;
    background-position: 0 0, 55px 80px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }

  /* ---------- Sparkle stars ---------- */
  .star {
    position: fixed;
    border-radius: 50%;
    background: #ffd9ea;
    z-index: 1;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(0.6); }
    50%      { opacity: 0.95; transform: scale(1.3); }
  }

  /* ---------- Title ---------- */
  .title {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: clamp(20px, 4.5vw, 44px);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .title h1 {
    font-size: clamp(26px, 4.5vw, 46px);
    font-weight: 700;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, #ffb3cf, #ff7aa8 45%, #e0a6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 120, 170, 0.45));
    animation: glowTitle 3s ease-in-out infinite;
  }
  @keyframes glowTitle {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(255,120,170,.35)); }
    50%      { filter: drop-shadow(0 0 34px rgba(255,120,170,.65)); }
  }
  .title .sub {
    margin-top: 10px;
    font-size: clamp(14px, 2.2vw, 20px);
    letter-spacing: 0.18em;
    color: rgba(255, 214, 232, 0.9);
  }
  .title .badge {
    display: inline-block;
    margin-top: 14px;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: clamp(13px, 1.8vw, 16px);
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #ffd6e6;
    background: rgba(80, 20, 45, 0.45);
    border: 1px solid rgba(255, 170, 200, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(255, 100, 160, 0.25);
  }

  /* ---------- 3D Character Stage ---------- */
  #stage {
    position: fixed; inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
  }

  /* ---------- Love message card ---------- */
  #loveCard {
    position: fixed;
    z-index: 11;
    bottom: clamp(28px, 7vh, 90px);
    left: 50%;
    width: min(92vw, 620px);
    transform: translateX(-50%) translateY(16px) scale(0.92);
    padding: 18px 22px;
    border-radius: 24px;
    background: rgba(52, 14, 32, 0.72);
    border: 1px solid rgba(255, 170, 200, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(255, 80, 140, 0.25), 0 0 60px rgba(255, 100, 160, 0.15);
    font-size: clamp(16px, 4.6vw, 26px);
    font-weight: 600;
    line-height: 1.45;
    color: #ffdfe9;
    text-align: center;
    opacity: 0;
    transition: opacity .6s ease, transform .6s ease;
    pointer-events: none;
    user-select: none;
    white-space: normal;
  }
  #loveCard.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  #loveCard.fade-out {
    opacity: 0;
  }

  /* ---------- Start overlay ---------- */
  #startOverlay {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: rgba(16, 5, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    transition: opacity .7s ease;
  }
  #startOverlay.hide { opacity: 0; pointer-events: none; }
  #startOverlay .inner {
    text-align: center;
    animation: invite 1.8s ease-in-out infinite;
  }
  #startOverlay .big { font-size: clamp(40px, 9vmin, 72px); }
  #startOverlay .txt {
    margin-top: 14px;
    font-size: clamp(15px, 2.4vw, 20px);
    letter-spacing: 0.22em;
    color: #ffd6e6;
    text-shadow: 0 0 20px rgba(255, 120, 170, 0.8);
  }
  @keyframes invite {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.06); opacity: 1; }
  }

  /* ---------- Burst hearts on tap ---------- */
  .burst {
    position: fixed;
    z-index: 12;
    pointer-events: none;
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="stars"></div>

<div class="title">
  <h1>พี่แจ๊ค ♡ น้องแก้ม</h1>
  <div class="sub">ถึงคนที่เค้ารักที่สุดในสามโลก</div>
  <div class="badge">💍 ครบรอบ 5 ปี 7 เดือน 💗</div>
</div>

<div id="stage"></div>

<div id="loveCard"></div>

<div id="startOverlay">
  <div class="inner">
    <div class="big">💗</div>
    <div class="txt">แตะเพื่อเปิดความรัก</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

(async function () {
  'use strict';

  /* ============================== 1. Background & UI Effects ============================== */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 2.6;
    s.style.width = s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.setProperty('--dur', (1.6 + Math.random() * 3) + 's');
    s.style.setProperty('--delay', (Math.random() * 4) + 's');
    starsEl.appendChild(s);
  }

  const loveCard = document.getElementById('loveCard');
  const messages = [
    'รักแก้มที่สุดในโลกเลยนะ ถึงจะดื้อไปหน่อย แต่ก็ไม่เคยคิดจะหยุดรักเลย... รอบนี้พี่ตั้งใจมองข้ามให้อีกที แต่น้องแก้มต้องน่ารักขึ้นแล้วนะ! 💗',
    'ปากบอกว่าน่ารำคาญ แต่ใจคือแพ้ทางแก้มตลอดเลยดิมั้ง... โดนพี่ดุไปนิดอย่าเพิ่งงอนล่ะ ปรับตัวหน่อยนะ ยัยตัวดี 💖',
    'ที่ยอมแพ้ตลอดไม่ใช่เพราะอะไรหรอกนะ เพราะรักล้วนๆ เลย! เลิกดื้อสัก 10% แล้วมาเป็นเด็กดีให้พี่ชื่นใจหน่อยสิ 💘',
    'ดื้อเก่งที่หนึ่ง แต่เรื่องทำให้พี่ตกหลุมรักซ้ำๆ ก็ที่หนึ่งเหมือนกันนะ... เอาเป็นว่าเจ๊ากัน แต่รอบนี้ต้องปรับตัวด้วยนะ รู้ยัง? 💝',
    'ถึงจะน่าตีขนาดไหน แต่พอเห็นหน้าแก้ม พี่ก็ใจอ่อนทุกที... สัญญาได้ไหมว่ารอบนี้จะทำตัวน่ารัก ไม่ดื้อให้พี่ปวดหัวอีก! 💞',
    'รักนะยัยแก้มอ้วน! ดื้อได้ แต่อย่าดื้อบ่อย พี่เหนื่อยง้อ แต่ถ้าปรับตัวให้หน่อย เดี๋ยวพาไปกินของอร่อยๆ เป็นรางวัลเลย! 💍🍰'
  ];
  let msgIdx = Math.floor(Math.random() * messages.length);
  let hideTimer = null;

  function showLove() {
    const msg = messages[msgIdx % messages.length];
    msgIdx = (msgIdx + 1) % messages.length;
    loveCard.classList.remove('show');
    loveCard.classList.add('fade-out');
    setTimeout(() => {
      loveCard.textContent = msg;
      loveCard.classList.remove('fade-out');
      loveCard.classList.add('show');
    }, 650);
    clearTimeout(hideTimer);
    const readTime = Math.min(14000, Math.max(7000, msg.length * 55));
    hideTimer = setTimeout(() => loveCard.classList.remove('show'), readTime);
  }
  (function loop() {
    showLove();
    const next = Math.min(14000, Math.max(7000, messages[msgIdx % messages.length].length * 55)) + 1400;
    setTimeout(loop, next);
  })();

  function burst(x, y, n) {
    for (let i = 0; i < (n || 14); i++) {
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = ['💗', '💖', '💕', '✨'][i % 4];
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      b.style.fontSize = (14 + Math.random() * 18) + 'px';
      document.body.appendChild(b);
      const dx = (Math.random() - 0.5) * 320;
      const dy = -(80 + Math.random() * 220);
      const rot = (Math.random() - 0.5) * 240;
      const dur = 900 + Math.random() * 700;
      b.animate([
        { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg) scale(0.6)', opacity: 1 },
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(1.1)', opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.15,.65,.4,1)' })
       .onfinish = () => b.remove();
    }
  }

  /* ============================== 2. 3D Character (The AI 3D Part) ============================== */
  const scene = new THREE.Scene();
  // ใช้สีพื้นหลังแบบ Romantic Gradient แทน Texture เพื่อให้เนียนกับพื้นหลัง HTML
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0.4, 2.3, 6.8);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  document.getElementById('stage').appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.85, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 3;
  controls.maxDistance = 12;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.4;

  scene.add(new THREE.HemisphereLight(0xfff2e0, 0x8a7462, 0.9));
  const key = new THREE.DirectionalLight(0xfff1dd, 2.6);
  key.position.set(3, 6, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffd9c4, 0.7);
  fill.position.set(-4, 3, 3);
  scene.add(fill);

  // Textures for character
  function makeDenimTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#93a9c9';
    x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 4000; i++) {
      const px = Math.random() * 256, py = Math.random() * 256;
      x.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(30,50,80,0.09)';
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + (Math.random() > 0.5 ? 3 : -3), py); x.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2.5, 2.5);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  function makeGinghamTexture() {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const x = c.getContext('2d');
    x.fillStyle = '#fff6f2';
    x.fillRect(0, 0, s, s);
    x.fillStyle = 'rgba(226,62,84,0.7)';
    const stripe = s / 4, half = s / 8;
    for (let i = 0; i < 4; i++) x.fillRect(i * stripe, 0, half, s);
    for (let i = 0; i < 4; i++) x.fillRect(0, i * stripe, s, half);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2, 2);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  const matSkin      = new THREE.MeshStandardMaterial({ color: 0xf6cfae, roughness: 0.55 });
  const matSkinShade = new THREE.MeshStandardMaterial({ color: 0xf0bd97, roughness: 0.55 });
  const matHair      = new THREE.MeshStandardMaterial({ color: 0x1b1519, roughness: 0.4, side: THREE.DoubleSide });
  const matBrow      = new THREE.MeshStandardMaterial({ color: 0x241a14, roughness: 0.5 });
  const matLip       = new THREE.MeshStandardMaterial({ color: 0xc22838, roughness: 0.3 });
  const matBlush     = new THREE.MeshBasicMaterial({ color: 0xf2919f, transparent: true, opacity: 0.5 });
  const matEyeWhite  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
  const matIris      = new THREE.MeshStandardMaterial({ color: 0x2e1a0e, roughness: 0.2 });
  const matPupil     = new THREE.MeshBasicMaterial({ color: 0x120a06 });
  const matShine     = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const matDenim     = new THREE.MeshStandardMaterial({ map: makeDenimTexture(), roughness: 0.85 });
  const matDenimDark = new THREE.MeshStandardMaterial({ color: 0x6f86a8, roughness: 0.8 });
  const matGingham   = new THREE.MeshStandardMaterial({ map: makeGinghamTexture(), roughness: 0.75 });
  const matGold      = new THREE.MeshStandardMaterial({ color: 0xe0b64f, metalness: 0.85, roughness: 0.3 });
  const matBerry     = new THREE.MeshStandardMaterial({ color: 0xe0324a, roughness: 0.35 });
  const matLeaf      = new THREE.MeshStandardMaterial({ color: 0x3f9b4f, roughness: 0.5 });
  const matSeed      = new THREE.MeshBasicMaterial({ color: 0xf7e3a1 });

  function S(r, mat, x, y, z, sx = 1, sy = 1, sz = 1) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), mat);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    return m;
  }
  function B(w, h, d, mat, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    return m;
  }
  function limb(a, b, r, mat) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), mat);
    m.position.copy(a).lerp(b, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return m;
  }
  const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

  const character = new THREE.Group();
  scene.add(character);

  const body = new THREE.Group();
  character.add(body);
  body.add(S(0.62, matDenim, 0, 0.78, 0, 1.15, 1, 0.75));
  body.add(S(0.33, matDenim, -0.64, 1.52, 0));
  body.add(S(0.33, matDenim, 0.64, 1.52, 0));
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.4, 20), matSkin);
  neck.position.set(0, 1.68, 0);
  body.add(neck);
  body.add(B(0.66, 1.05, 0.12, matGingham, 0, 0.95, 0.42));

  const berry = new THREE.Group();
  berry.add(S(0.095, matBerry, 0, 0, 0, 1, 1.15, 0.85));
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.07, 8), matLeaf);
  leaf.position.set(0, 0.12, 0);
  berry.add(leaf);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.05, 6), matLeaf);
  stem.position.set(0, 0.17, 0);
  berry.add(stem);
  [[0.03, 0.02], [-0.04, 0.05], [0.05, -0.05], [-0.02, -0.06], [0, 0.08], [-0.06, -0.01], [0.07, 0.03], [-0.05, 0.08]]
    .forEach(([sx, sy]) => berry.add(S(0.012, matSeed, sx, sy, 0.075)));
  berry.position.set(-0.2, 0.72, 0.5);
  berry.rotation.z = 0.15;
  body.add(berry);

  const edgeL = B(0.05, 1.2, 0.06, matDenimDark, -0.36, 0.95, 0.44);
  edgeL.rotation.y = 0.1;
  const edgeR = B(0.05, 1.2, 0.06, matDenimDark, 0.36, 0.95, 0.44);
  edgeR.rotation.y = -0.1;
  body.add(edgeL, edgeR);
  const collarL = B(0.36, 0.26, 0.08, matDenimDark, -0.3, 1.6, 0.38);
  collarL.rotation.z = 0.45; collarL.rotation.x = -0.25;
  const collarR = B(0.36, 0.26, 0.08, matDenimDark, 0.3, 1.6, 0.38);
  collarR.rotation.z = -0.45; collarR.rotation.x = -0.25;
  body.add(collarL, collarR);
  [1.15, 0.8, 0.45].forEach(by => {
    const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.02, 16), matGold);
    btn.position.set(0.36, by, 0.47);
    btn.rotation.x = Math.PI / 2;
    body.add(btn);
  });

  body.add(limb(V3(-0.66, 1.5, 0), V3(-1.18, 1.8, 0.12), 0.19, matDenim));
  body.add(limb(V3(-1.18, 1.8, 0.12), V3(-1.12, 2.28, 0.42), 0.16, matDenim));
  body.add(limb(V3(-1.13, 2.24, 0.4), V3(-1.11, 2.36, 0.45), 0.18, matDenimDark));
  const peaceHand = new THREE.Group();
  peaceHand.add(S(0.14, matSkin, 0, 0, 0, 0.8, 1.05, 0.5));
  peaceHand.add(limb(V3(-0.055, 0.1, 0), V3(-0.09, 0.38, 0), 0.042, matSkin));
  peaceHand.add(limb(V3(0.05, 0.1, 0), V3(0.09, 0.4, 0), 0.042, matSkin));
  peaceHand.add(limb(V3(0.085, 0.03, 0.02), V3(0.1, 0.02, 0.12), 0.04, matSkin));
  peaceHand.add(limb(V3(0.03, 0.01, 0.03), V3(0.04, 0.0, 0.13), 0.038, matSkin));
  peaceHand.add(limb(V3(-0.1, -0.06, 0.02), V3(-0.16, 0.04, 0.06), 0.042, matSkin));
  peaceHand.position.set(-1.14, 2.44, 0.5);
  peaceHand.rotation.set(-0.1, -0.15, -0.1);
  body.add(peaceHand);
  body.add(limb(V3(0.66, 1.5, 0), V3(0.92, 1.02, 0.1), 0.19, matDenim));
  body.add(limb(V3(0.92, 1.02, 0.1), V3(0.84, 0.66, 0.3), 0.16, matDenim));
  body.add(limb(V3(0.85, 0.7, 0.28), V3(0.83, 0.62, 0.33), 0.18, matDenimDark));
  body.add(S(0.13, matSkin, 0.83, 0.58, 0.36));

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 2.45, 0);
  character.add(headGroup);
  headGroup.add(S(1, matSkin, 0, 0, 0, 0.98, 1, 0.94));
  const hf = new THREE.Mesh(new THREE.SphereGeometry(1.16, 48, 24, 0, Math.PI, 0, 1.15), matHair);
  const hb = new THREE.Mesh(new THREE.SphereGeometry(1.16, 48, 24, Math.PI, Math.PI, 0, 2.55), matHair);
  headGroup.add(hf, hb);
  headGroup.add(S(0.95, matHair, 0, -0.35, -0.3, 0.95, 0.92, 0.72));
  const lL = S(1, matHair, -0.92, -0.45, 0.12, 0.3, 0.95, 0.5); lL.rotation.z = 0.08;
  const lR = S(1, matHair, 0.92, -0.45, 0.12, 0.3, 0.95, 0.5); lR.rotation.z = -0.08;
  headGroup.add(lL, lR);
  const bL = S(1, matHair, -0.42, 0.4, 0.82, 0.5, 0.16, 0.28); bL.rotation.z = 0.55; bL.rotation.y = 0.3;
  const bR = S(1, matHair, 0.42, 0.4, 0.82, 0.5, 0.16, 0.28); bR.rotation.z = -0.55; bR.rotation.y = -0.3;
  headGroup.add(bL, bR);
  headGroup.add(S(0.22, matHair, 0, 1.25, -0.08));
  headGroup.add(S(0.17, matHair, 0.09, 1.13, -0.16));
  headGroup.add(S(0.15, matHair, -0.1, 1.17, -0.02));
  const gr = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 12, 28), matGold);
  gr.position.set(0, 1.05, -0.05); gr.rotation.x = 1.3;
  headGroup.add(gr);

  const eyeGroups = [];
  function makeEye(sign) {
    const g = new THREE.Group();
    g.add(S(0.155, matEyeWhite, 0, 0, 0, 1, 0.85, 0.55));
    g.add(S(0.095, matIris, 0, -0.005, 0.075, 1, 1, 0.55));
    g.add(S(0.048, matPupil, 0, -0.005, 0.115, 1, 1, 0.5));
    g.add(S(0.03, matShine, -0.035, 0.05, 0.14));
    g.add(S(0.015, matShine, 0.03, -0.04, 0.13));
    const lsh = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.022, 10, 24, Math.PI), matBrow);
    lsh.position.set(0, 0.02, 0.1); g.add(lsh);
    const wn = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.09, 8), matBrow);
    wn.position.set(0.16 * sign, 0.06, 0.09); wn.rotation.z = -1.0 * sign; wn.scale.z = 0.4;
    g.add(wn);
    g.position.set(0.34 * sign, 0.05, 0.8); g.rotation.y = 0.38 * sign;
    headGroup.add(g); eyeGroups.push(g); return g;
  }
  makeEye(-1); makeEye(1);
  headGroup.add(limb(V3(-0.46, 0.33, 0.74), V3(-0.22, 0.36, 0.8), 0.032, matBrow));
  headGroup.add(limb(V3(0.46, 0.33, 0.74), V3(0.22, 0.36, 0.8), 0.032, matBrow));
  headGroup.add(S(0.07, matSkinShade, 0, -0.18, 0.9, 1, 0.85, 0.8));
  headGroup.add(S(0.105, matLip, 0, -0.39, 0.86, 1.45, 0.75, 0.75));
  headGroup.add(S(0.085, matLip, 0, -0.29, 0.87, 1.3, 0.55, 0.7));
  headGroup.add(S(0.04, matLip, 0, -0.23, 0.9));
  const blL = S(0.15, matBlush, -0.56, -0.18, 0.74, 1, 0.7, 0.3); blL.rotation.y = -0.6;
  const blR = S(0.15, matBlush, 0.56, -0.18, 0.74, 1, 0.7, 0.3); blR.rotation.y = 0.6;
  headGroup.add(blL, blR);
  character.traverse(o => { if (o.isMesh) o.castShadow = true; });

  /* ============================== 3. Interaction Logic ============================== */
  function spawnCharacter(point) {
    const clone = character.clone();
    clone.position.copy(point).add(V3(0, 0.5, 0));
    clone.scale.setScalar(0.5);
    scene.add(clone);
    setTimeout(() => {
      scene.remove(clone);
      clone.traverse(o => { if (o.isMesh) o.material.dispose(); });
    }, 3000);
  }

  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  let downPos = null;

  renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!downPos) return;
    const dx = e.clientX - downPos[0], dy = e.clientY - downPos[1];
    downPos = null;
    if (dx * dx + dy * dy > 25) return;
    pointerNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(pointerNDC, camera);
    const hit = raycaster.intersectObject(character, true)[0];
    if (hit) spawnCharacter(hit.point);
  });

  /* ============================== 4. Audio & Overlays ============================== */
  let audioCtx = null, musicGain = null, musicPlaying = false;
  const scale_ = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  function playNote(freq, time, dur, type, gain) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(gain, time + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    o.connect(g).connect(musicGain);
    o.start(time); o.stop(time + dur + 0.05);
  }
  function scheduleMusic() {
    if (!musicPlaying) return;
    const now = audioCtx.currentTime;
    const bpm = 86, beat = 60 / bpm;
    const pattern = [[0, 2, 4, 2], [1, 3, 5, 3], [2, 4, 6, 4], [4, 3, 1, 3]];
    let t = now + 0.1;
    for (const bar of pattern) {
      for (let i = 0; i < 4; i++) {
        playNote(scale_[bar[i]], t, beat * 0.6, 'sine', 0.07);
        t += beat * 0.5;
      }
      playNote(scale_[0], t, beat * 1.5, 'triangle', 0.04);
      playNote(scale_[2], t, beat * 1.5, 'triangle', 0.035);
      playNote(scale_[4], t, beat * 1.5, 'triangle', 0.03);
      t += beat * 1.5;
    }
    setTimeout(scheduleMusic, (t - now) * 1000 + 50);
  }
  function startAudio() {
    if (musicPlaying) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.35;
      musicGain.connect(audioCtx.destination);
      musicPlaying = true;
      scheduleMusic();
    } catch (e) {}
  }

  const overlay = document.getElementById('startOverlay');
  overlay.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    overlay.classList.add('hide');
    startAudio();
    burst(window.innerWidth / 2, window.innerHeight / 2, 24);
  }, { once: false });

  /* ============================== 5. Animation Loop ============================== */
  const clock = new THREE.Clock();
  let nextBlink = 2.5, blinkT = -1;

  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    character.position.y = Math.sin(t * 1.3) * 0.02;
    headGroup.rotation.z = 0.05 + Math.sin(t * 0.6) * 0.03;
    peaceHand.rotation.z = -0.1 + Math.sin(t * 1.8) * 0.06;
    if (t > nextBlink) { blinkT = 0; nextBlink = t + 2.5 + Math.random() * 3.5; }
    if (blinkT >= 0) {
      blinkT += dt;
      const p = blinkT / 0.22;
      const s = p >= 1 ? 1 : 1 - Math.sin(Math.min(p, 1) * Math.PI) * 0.92;
      eyeGroups.forEach(g => { g.scale.y = s; });
      if (p >= 1) { eyeGroups.forEach(g => { g.scale.y = 1; }); blinkT = -1; }
    }
    controls.update();
    renderer.render(scene, camera);
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

})();
</script>
</body>
